  <a class="logo" href="index.html"><img src="images/avatar.svg" alt="شعار ريناد">ريناد</a>
  <nav>
    <button id="menuBtn" aria-label="القائمة">☰</button>

    </ul>
  </nav>
</div></header>
<main><div class="container" style="padding-block:3.5rem">
  <h1>تواصل معي</h1>
  <p style="margin:.6rem 0 1.8rem">اكتب رسالتك وسأرد عليك. كل الحقول مطلوبة.</p>
  <form id="form" novalidate>
    <div><label for="name">الاسم</label><input id="name" type="text" autocomplete="name"><div class="err" id="e-name"></div></div>
    <div><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" dir="ltr"><div class="err" id="e-email"></div></div>
    <div><label for="msg">الرسالة</label><textarea id="msg" rows="5"></textarea><div class="err" id="e-msg"></div></div>
    <button class="btn primary" type="submit">إرسال الرسالة</button>
    <div class="ok" id="ok" role="status">تم إرسال رسالتك. شكرا لك!</div>
  </form>
</div></main>
<footer><div class="container">© 2026 ريناد — مشروع مقرر مبادئ برمجة صفحات الإنترنت</div></footer>
